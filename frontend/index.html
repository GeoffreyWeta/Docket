<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the shell paint under the notch and home bar;
         every edge that matters pads itself back with env(safe-area-inset-*).
         No maximum-scale / user-scalable: pinch-zoom stays available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- the page surface behind the phone's own chrome. applyTheme in theme.js
         keeps this in step when somebody flips the switch. -->
    <meta name="theme-color" content="#F2F6F3" />
    <!-- installed to a phone home screen, DOCKET runs full-bleed with the
         sidebar green behind the status bar -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DOCKET" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="DOCKET: sealed-bid tendering, cryptographic sealing, blind evaluation and a tamper-evident audit trail." />
    <title>DOCKET: sealed-bid tendering</title>
    <!-- The house seal, inlined so the tab icon costs no request: the deep
         green field the rail and the page band are painted in, a brand-green
         wax disc with a darker rim, the light inner ring, and one off-centre
         specular. The same five colours tools/make-icons.mjs rasterises for
         iOS and Android, so keep the two in step. An SVG favicon scales to
         every tab and retina density from one string. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B3D24'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%2300A651'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2304452A' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='16' r='4.4' fill='none' stroke='%237DE8AE' stroke-width='1.3'/%3E%3Ccircle cx='11.4' cy='11.4' r='1.3' fill='%23EAFBF2'/%3E%3C/svg%3E" />
    <!-- iOS ignores SVG icons, so a home-screen install needs a raster one or it
         uses a screenshot of the page. Generated by tools/make-icons.mjs. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Paint the right surface before the bundle evaluates, so first paint is
         never white, and never the wrong theme. Bare html is the light theme,
         matching the block on :root in styles.js, which is ALSO the default, so
         a first visit needs no attribute stamped at all and still paints
         correctly. Only a remembered "dark" changes anything here. */
      html { background: #F2F6F3; }
      html[data-theme="dark"] { background: #0C1511; color-scheme: dark; }
    </style>
    <script>
      /* Stamp the remembered theme on <html> before first paint. Kept inline and
         dependency-free on purpose: any later application would flash.

         This is the ONLY place a remembered theme is restored on load — the
         bundle's applyTheme runs when somebody clicks the switcher, not at boot.

         It DOES carry the list of ids it will accept, and that is a deliberate
         reversal. The script used to stamp whatever was in storage, on the
         reasoning that an allowlist here would drift from the themes and a new
         theme would silently fail to survive a reload. Removing themes turned
         that around: a browser still remembering `circle` or `engo` got the
         dead id stamped on <html>, where it matches no block. The page painted
         anyway, because :root carries the light theme, but the attribute was a
         lie and anything keyed off it did the wrong thing quietly.

         Both failure modes are drift; only one of them is visible. A theme you
         forgot to add here simply does not restore, which you notice the first
         time you reload. A dead id you forgot to remove is invisible.

         So: ADDING OR RENAMING A THEME MEANS THREE PLACES — the token block in
         styles.js, one line in the <style> above (its pre-paint background and
         colour-scheme), and the id check below. THEMES in theme.js is the
         canonical list; this is the pre-paint copy of it.

         Nothing stored means the light theme, which owns :root and the bare
         html rule above, so there is nothing to stamp and we leave early
         rather than writing an attribute that changes nothing. */
      (function () {
        try {
          var t = localStorage.getItem("docket.theme");
          if (!t) return;
          /* Only ids this stylesheet actually has a block for. A browser that
             remembers a theme we have since deleted would otherwise get it
             stamped on <html>, where it matches nothing: the page still paints,
             because :root carries the light theme, but the attribute is a lie
             and anything keyed off it silently does the wrong thing. Unknown
             ids fall through to the default rather than being honoured. */
          if (t !== "dark") return;
          document.documentElement.setAttribute("data-theme", t);
          /* Read the scheme back out of the stylesheet above rather than
             matching the id against a second list that could drift from it. */
          var scheme = getComputedStyle(document.documentElement).colorScheme;
          if (scheme && scheme.indexOf("dark") !== -1) {
            var m = document.querySelector('meta[name="color-scheme"]');
            if (m) m.setAttribute("content", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
