<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the shell paint under the notch and home bar;
         every edge that matters pads itself back with env(safe-area-inset-*).
         No maximum-scale / user-scalable: pinch-zoom stays available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- the default theme's navigation surface: it tints the phone's own chrome -->
    <meta name="theme-color" content="#111827" />
    <!-- installed to a phone home screen, DOCKET runs full-bleed with the
         sidebar green behind the status bar -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DOCKET" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="DOCKET: sealed-bid tendering, cryptographic sealing, blind evaluation and a tamper-evident audit trail." />
    <title>DOCKET: sealed-bid tendering</title>
    <!-- The seal on the default theme's navigation slate, inlined so the tab
         icon costs no request: rounded tile, rose disc with a rim, one
         off-centre specular and the inner ring, the same mark SealMark draws.
         An SVG favicon scales to every tab and retina density from one string. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23E11D48'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23881337' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='16' r='4.4' fill='none' stroke='%23FB7185' stroke-width='1.3'/%3E%3Ccircle cx='11.4' cy='11.4' r='1.3' fill='%23FDA4AF'/%3E%3C/svg%3E" />
    <!-- iOS ignores SVG icons, so a home-screen install needs a raster one or it
         uses a screenshot of the page. Generated by tools/make-icons.mjs. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Paint the right surface before the bundle evaluates, so first paint is
         never white, and never the wrong theme. Bare html is the default theme
         (studio), matching the block on :root in styles.js. */
      html { background: #F7F8FA; }
      html[data-theme="paper"] { background: #F4F3ED; }
      html[data-theme="material"] { background: #F6F5F9; }
      html[data-theme="material-dark"] { background: #121216; color-scheme: dark; }
      html[data-theme="night"] { background: #0F1613; color-scheme: dark; }
      html[data-theme="glass"] { background: #091614; color-scheme: dark; }
    </style>
    <script>
      /* Stamp the remembered theme on <html> before first paint. Kept inline and
         dependency-free on purpose: any later application would flash.

         This is the ONLY place a remembered theme is restored on load — the
         bundle's applyTheme runs when somebody clicks the switcher, not at boot.
         So this script must not carry a list of the themes it will accept: it
         used to, and a theme added everywhere else silently failed to survive a
         reload, because the id fell through an allowlist nobody thought to
         update. It now stamps whatever was stored and lets CSS decide what that
         means, which is where the per-theme knowledge already lives.

         The pattern check is shape-only — this reads the visitor's own browser
         storage, so the concern is a malformed attribute selector, not a hostile
         one. An unknown id simply matches no rule and the default paints.

         Adding a theme: one line in the <style> above (its pre-paint background
         and colour-scheme), and the token block in styles.js. Nothing here. */
      (function () {
        try {
          var t = localStorage.getItem("docket.theme");
          if (!t || !/^[a-z][a-z0-9-]{0,23}$/.test(t)) return;
          document.documentElement.setAttribute("data-theme", t);
          /* Read the scheme back out of the stylesheet above rather than
             matching the id against a second list that could drift from it. */
          var scheme = getComputedStyle(document.documentElement).colorScheme;
          if (scheme && scheme.indexOf("dark") !== -1) {
            var m = document.querySelector('meta[name="color-scheme"]');
            if (m) m.setAttribute("content", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
