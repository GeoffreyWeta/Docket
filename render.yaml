# Render Blueprint — deploy with "New +" → "Blueprint" and point at this repo.
services:
  - type: web
    name: docket
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn docket.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: WEB_CONCURRENCY
        value: 2
      - key: DATABASE_URL
        fromDatabase:
          name: docket-db
          property: connectionString
      # Demo one-click logins on the sign-in screen. Set to "0" to require
      # passwords for everyone. DEMO_PASSWORD is the seeded account password.
      - key: DEMO_LOGIN
        value: "1"
      - key: DEMO_PASSWORD
        generateValue: true
      # Optional — powers the six AI features. Without it they degrade
      # gracefully to a "not configured" message; everything else works.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional SMTP — when set, every in-app notification is also emailed.
      # Without it, emails print to the server log (console backend).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: docket-db
    plan: free
