# Render Blueprint — deploy with "New +" → "Blueprint" and point at this repo.
services:
  - type: web
    name: docket
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn docket.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      # Sealed bid amounts, line prices and documents are encrypted with a key
      # derived from SECRET_KEY. Never rotate it on a deployment holding sealed
      # bids — the ciphertext becomes unreadable.
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: WEB_CONCURRENCY
        value: 2
      # Set this in the dashboard to the Internal Database URL of the existing
      # Postgres instance, pointing at the dedicated `docket_db` database (NOT
      # the neighbouring app's database — DOCKET needs its own, since it has its
      # own `core` app and would collide on migration names).
      - key: DATABASE_URL
        sync: false
      # Demo one-click logins on the sign-in screen. Set to "0" to require
      # passwords for everyone. DEMO_PASSWORD is the seeded account password.
      - key: DEMO_LOGIN
        value: "1"
      - key: DEMO_PASSWORD
        generateValue: true
      # Optional — a private, time-limited link to the vendor register JSON
      # export. Set it in the dashboard and every deploy refreshes the register
      # from it; leave it unset and the deployment keeps the seeded demo
      # suppliers. The register is never committed: it holds real bank details,
      # TINs, emails and phone numbers for about 1,400 companies.
      - key: VENDORS_URL
        sync: false
      # Optional — powers the six AI features. Without it they degrade
      # gracefully to a "not configured" message; everything else works.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional SMTP — when set, every in-app notification is also emailed.
      # Without it, emails print to the server log (console backend).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

# No `databases:` block — DOCKET reuses an existing Postgres instance via the
# DATABASE_URL above. Add one back only if you want Render to provision a
# dedicated instance for this app (free tier allows one Postgres per account).
